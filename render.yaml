# Render Blueprint — web service only (most reliable sync).
# Create Postgres manually in the dashboard, then set DATABASE_URL on this service.
# See DEPLOY.md for steps.
#
# For one-click Postgres in the blueprint, use render.full.yaml instead.

services:
  - type: web
    name: smart-library
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn libraryapp.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
