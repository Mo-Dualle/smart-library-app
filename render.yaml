# Render Blueprint — optional one-click deploy from the Render dashboard.
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy: open the web service → Shell → run:
#   python manage.py createsuperuser

databases:
  - name: libraryapp-db
    plan: free
    databaseName: libraryapp
    user: libraryapp

services:
  - type: web
    name: libraryapp
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn libraryapp.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /books/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: libraryapp-db
          property: connectionString
