# Optional Blueprint: web + free Postgres in one sync.
# Use only if you do NOT already have a free Render Postgres database.
# Dashboard → New → Blueprint → set blueprint file path to render.full.yaml

databases:
  - name: smart-library-db
    plan: free
    databaseName: smart_library
    user: smart_library

services:
  - type: web
    name: smart-library
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn libraryapp.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-library-db
          property: connectionString
